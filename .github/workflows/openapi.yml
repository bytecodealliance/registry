name: Validate openapi spec
on:
  push:
    branches:
      - main
    tags: ['[0-9]*']
  pull_request:
    branches:
      - main
      - 'release-*'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Validate
      shell: bash
      run: |
        docker run --rm -v "${PWD}:/local" \
            openapitools/openapi-generator-cli validate \
            -i /local/crates/server/openapi.yaml
